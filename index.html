<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Thư viện quiz kiến thức game, mở đầu với Liên Quân Mobile và PUBG.">
<title>Đố Vui Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Oswald:wght@500;700&family=Baloo+2:wght@600;800&family=Roboto+Slab:wght@500;700&family=Playfair+Display:ital,wght@0,700;1,500;1,700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: một cột như tập kịch bản. Mỗi game mang bảng màu riêng (data-film), trang thư viện là sảnh chờ tối */
:root, [data-film="home"] {
  --bg: #15121b; --bg-art: radial-gradient(1200px 500px at 50% -10%, #3a2a4a66, transparent 70%);
  --card: #1f1a27; --opt: #262030; --ink: #f4eff8; --muted: #a79fb4; --line: #342c40;
  --accent: #ffb547; --accent-ink: #1a1305; --accent2: #ff6b6b;
  --ok: #5fd0a0; --ok-soft: #173a2e; --no: #ff7a6b; --no-soft: #3d1d1c;
  --display: "Fraunces", Georgia, serif;
  color-scheme: dark;
}
.mode.terms { border-left: 4px solid var(--ok); }
.mode.terms:hover { border-color: var(--ok); }
.mode.all { border-left: 4px solid var(--ink); background: color-mix(in srgb, var(--accent) 10%, var(--opt)); }
.mode.all:hover { border-color: var(--ink); }
.tag.all { background: var(--ink); color: var(--card); }
.cat { color: var(--muted); }
.mode.eps { border-left: 4px solid var(--no); }
.mode.eps:hover { border-color: var(--no); }
.tag.eps { background: var(--no); color: var(--card); }
.tag.terms { background: var(--ok); color: var(--card); }
.mode.skills { border-left: 4px solid var(--skill); }
.mode.skills:hover { border-color: var(--skill); }
.tag.skills { background: var(--skill); color: var(--card); }
.skillbox { display: grid; gap: 6px; padding: 10px; border: 1.5px dashed var(--skill); border-radius: 14px; }
.skillbox > .label { color: var(--skill); }
.mode.sub { padding: 7px 12px; border-left-width: 3px; }
.mode.sub .mode-name { font-size: 14px; font-weight: 500; }
[data-film="lien-quan-mobile"] {
  --bg: #0a1024;
  --bg-art: radial-gradient(800px 420px at 85% -10%, #e9b94940, transparent 70%), radial-gradient(600px 420px at 0% 100%, #2f6bff33, transparent 70%);
  --card: #111a35; --opt: #16213f; --ink: #f2f4fb; --muted: #9aa6c4; --line: #26345c;
  --accent: #f0c04a; --accent-ink: #1a1404; --accent2: #4f8bff;
  --ok: #4fd1a0; --ok-soft: #123329; --no: #ff6f6f; --no-soft: #3d1a20;
  --display: "Baloo 2", "Trebuchet MS", sans-serif;
  color-scheme: dark;
}
[data-film="pubg"] {
  --bg: #13140f;
  --bg-art: radial-gradient(800px 400px at 50% -10%, #f2a90038, transparent 70%), repeating-linear-gradient(135deg, #ffffff05 0 2px, transparent 2px 16px);
  --card: #1c1e16; --opt: #24261c; --ink: #f3f1e6; --muted: #aaa892; --line: #393b2c;
  --accent: #f2a900; --accent-ink: #161100; --accent2: #8fa35a;
  --ok: #8fd36b; --ok-soft: #1f3317; --no: #ff6a4d; --no-soft: #3d1c14;
  --display: "Oswald", "Arial Narrow", sans-serif;
  color-scheme: dark;
}
body, .film { --skill: color-mix(in srgb, var(--accent) 45%, var(--ok)); }
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100vh;
  background: var(--bg-art), var(--bg); background-attachment: fixed;
  color: var(--ink); font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 64px;
  transition: background-color .4s, color .4s;
}
[hidden] { display: none !important; }
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 32px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.15; text-wrap: balance; margin: 0; }
.label { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Masthead */
.mast { display: grid; gap: 8px; }
.mast h1 { font-size: clamp(36px, 8vw, 56px); font-family: "Fraunces", Georgia, serif; }
.mast h1 em { font-style: italic; font-weight: 500; color: var(--accent); }
.mast p { margin: 0; color: var(--muted); max-width: 56ch; }
body:not([data-film="home"]) .mast { display: none; }

/* Library: mỗi thẻ là một tấm poster nhỏ mang màu của game */
.shelf { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.film {
  position: relative; overflow: hidden; text-align: left; color: var(--ink);
  background: var(--bg-art), var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 0; display: grid; grid-template-rows: auto 1fr; transition: transform .2s, box-shadow .2s;
}
.film:hover { transform: translateY(-3px); box-shadow: 0 14px 40px -18px var(--accent); }
.film .poster {
  height: 112px; display: grid; place-items: center; border-bottom: 1px solid var(--line);
  font-family: var(--display); font-size: 40px; letter-spacing: .06em; color: var(--accent);
  background: radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%), var(--opt);
}
.film .body { padding: 18px 20px 20px; display: grid; gap: 8px; align-content: start; }
.film h3 { font-size: 23px; }
.film .meta { font-size: 14px; color: var(--muted); }
.film .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.pill { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; padding: 3px 10px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.film.soon { cursor: default; border-style: dashed; background: transparent; }
.film.soon:hover { transform: none; box-shadow: none; }
.film.soon .poster { color: var(--muted); background: transparent; font-size: 32px; }
.film.soon h3 { color: var(--muted); font-weight: 500; font-style: italic; }

/* Game */
.game { display: grid; gap: 20px; }
.hero { display: grid; gap: 6px; }
.hero .motif { font-family: var(--display); color: var(--accent); font-size: 15px; letter-spacing: .2em; }
.hero h1 { font-size: clamp(32px, 7vw, 48px); }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.back { background: none; border: 0; padding: 0; color: var(--muted); font-size: 14px; }
.back:hover { color: var(--accent); }
.track { display: grid; grid-auto-flow: column; gap: 3px; }
.track span { height: 6px; border-radius: 3px; background: var(--line); }
.track span.ok { background: var(--ok); }
.track span.no { background: var(--no); }
.track span.now { background: var(--accent); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: clamp(20px, 5vw, 36px); display: grid; gap: 20px; box-shadow: 0 20px 50px -30px color-mix(in srgb, var(--accent) 60%, transparent); }
.qhead { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.num { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; }
.score { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.q { font-size: clamp(22px, 4.5vw, 28px); }
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: center; text-align: left;
  background: var(--opt); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; color: var(--ink);
  transition: border-color .12s, background .12s, transform .12s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); transform: translateX(2px); }
.opt .key { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; border: 1px solid var(--line); color: var(--muted); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .key { background: var(--ok); border-color: var(--ok); color: var(--card); }
.opt.wrong { border-color: var(--no); background: var(--no-soft); }
.opt.wrong .key { background: var(--no); border-color: var(--no); color: var(--card); }
.explain { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 4px; }
.explain strong { font-family: var(--display); font-size: 19px; }
.explain.ok strong { color: var(--ok); }
.explain.no strong { color: var(--no); }
.explain p { margin: 0; color: var(--muted); }
.actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 99px; padding: 11px 22px; background: var(--accent); color: var(--accent-ink); font-weight: 600; transition: filter .15s; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.ghost:hover { border-color: var(--accent); }

/* Result */
.big { font-family: var(--display); font-size: clamp(64px, 16vw, 104px); line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }
.big small { font-size: .4em; color: var(--muted); font-weight: 500; }
.verdict { font-family: var(--display); font-style: italic; font-size: 22px; margin: 0; }
.review { display: grid; margin: 0; padding: 0; list-style: none; }
.review li { display: grid; grid-template-columns: 20px 1fr; gap: 10px; font-size: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.review li:last-child { border-bottom: 0; }
.review .mark { font-family: "JetBrains Mono", ui-monospace, monospace; }
.review .mark.ok { color: var(--ok); }
.review .mark.no { color: var(--no); }
.review .ans { color: var(--muted); }
.foot { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
.foot a { color: var(--muted); }
.modes { display: grid; gap: 8px; margin-top: 8px; }
.mode {
  display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; text-align: left;
  border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--opt); color: var(--ink);
  transition: border-color .15s, transform .15s;
}
.mode:hover { border-color: var(--accent); transform: translateX(2px); }
.mode .mode-name { font-weight: 600; font-size: 15px; }
.mode .mode-meta { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; color: var(--muted); }
.mode.facts { border-left: 4px solid var(--accent); }
.mode.emo { border-left: 4px solid var(--accent2); }
.mode.emo:hover { border-color: var(--accent2); }
.hero-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
.tag { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; letter-spacing: .04em; padding: 4px 12px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); }
.tag.emo { background: var(--accent2); color: #ffffff; }
.switch { background: none; border: 0; padding: 0; font-size: 14px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.switch:hover { color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body data-film="home">

<div class="wrap">
  <header class="mast">
    <span class="label">Thư viện câu đố game</span>
    <h1>Đố Vui <em>Game</em></h1>
    <p>Chọn một tựa game, trả lời từng câu và xem bạn hiểu game đến đâu. Mỗi đáp án đều có giải thích kèm theo.</p>
  </header>

  <section id="library" aria-label="Chọn game">
    <div class="shelf" id="shelf"></div>
  </section>

  <section id="game" class="game" hidden aria-live="polite"></section>

  <footer class="foot" id="foot"></footer>
</div>

<script>
const FILMS = [
  {
    id: "lien-quan-mobile",

    original: "Arena of Valor · 2016",
    meta: "MOBA 5v5 · TiMi Studio (Tencent) · Garena phát hành tại Việt Nam",
    epLabel: "Tướng & trận đấu",
    sources: [

    ],
    termSources: [

    skillSources: [

      { q: "Studio nào phát triển Liên Quân Mobile?", a: "TiMi Studio của Tencent", w: ["Riot Games", "Moonton", "Krafton"], e: "TiMi Studio (Tencent) phát triển game; Garena phát hành tại Việt Nam và nhiều nước Đông Nam Á." },
      { q: "Ở Việt Nam, Liên Quân Mobile do công ty nào phát hành?", a: "Garena", w: ["VNG", "VTC Game", "Gamota"], e: "Tên đầy đủ quen thuộc là \"Garena Liên Quân Mobile\"." },
      { q: "Liên Quân Mobile ra mắt tại Việt Nam vào năm nào?", a: "2016", w: ["2012", "2019", "2021"], e: "Game ra mắt người chơi Việt cuối năm 2016 và nhanh chóng trở thành MOBA di động phổ biến nhất." },
      { q: "Tên quốc tế của Liên Quân Mobile là gì?", a: "Arena of Valor", w: ["Mobile Legends", "Wild Rift", "Heroes Evolved"], e: "Ở Đài Loan là Garena 傳說對決, ở Thái Lan là RoV, còn bản phương Tây gọi là Arena of Valor." },

      { q: "Một trận đấu chính thức (chế độ xếp hạng) có bao nhiêu người chơi?", a: "10 người, chia thành hai đội 5 người", w: ["6 người, hai đội 3", "100 người, tự do", "8 người, hai đội 4"], e: "Bản đồ chính là 5v5 với ba đường và khu rừng ở giữa." },
      { q: "Mục tiêu cuối cùng để giành chiến thắng là gì?", a: "Phá hủy nhà chính của đội đối phương", w: ["Hạ gục đủ 50 mạng", "Chiếm giữ trung tâm bản đồ 10 phút", "Là đội cuối cùng còn sống"], e: "Hạ mạng chỉ là phương tiện; trận đấu kết thúc khi nhà chính một bên bị phá." },

      { q: "\"Bo\" trong cách nói của game thủ Việt là gì?", a: "Vùng an toàn đang thu hẹp", w: ["Một loại súng", "Chiếc xe máy", "Đồng đội"], e: "\"Chạy bo\", \"nhà bo\" (nhà nằm trong vùng an toàn cuối) là những cụm quen thuộc." },
      { q: "\"Thính\" là gì?", a: "Thùng tiếp tế thả từ máy bay", w: ["Một loại thuốc hồi máu", "Súng ngắn", "Chế độ chơi"], e: "Thùng thính chứa súng xịn, giáp và mũ cấp 3, nhưng cũng là mồi nhử." },
      { q: "\"Camp\" nghĩa là gì?", a: "Nằm im một chỗ chờ đối thủ đến", w: ["Chạy liên tục", "Nhảy dù sớm", "Chơi một mình"], e: "Camp nhà hoặc bụi cỏ là lối chơi gây tranh cãi nhưng hiệu quả." },
      { q: "\"Knock\" (đánh gục) trong chế độ đội khác gì hạ hẳn?", a: "Người bị gục bò được và có thể được đồng đội cứu dậy", w: ["Giống hệt bị hạ", "Hồi máu đầy ngay", "Được hồi sinh ở máy bay"], e: "Chỉ khi bị kết liễu hoặc hết máu ở trạng thái gục mới bị loại." },
      { q: "\"Liếm hòm\" là hành động gì?", a: "Nhặt đồ từ hòm của người đã bị hạ", w: ["Mở thùng thính", "Phá cửa", "Sửa xe"], e: "Liếm hòm vội vàng giữa giao tranh là nguyên nhân bị hạ phổ biến." },
      { q: "\"Rush\" trong PUBG là gì?", a: "Lao thẳng vào tấn công đối thủ", w: ["Nằm im", "Rút lui", "Đi nhặt đồ"], e: "Rush cần đồng đội phối hợp và lựu đạn, choáng hỗ trợ." },
      { q: "\"Headshot\" là gì?", a: "Bắn trúng đầu, gây sát thương cao nhất", w: ["Bắn trúng chân", "Bắn trượt", "Ném lựu đạn"], e: "Mũ bảo hiểm cấp càng cao càng giảm sát thương từ headshot." },
      { q: "\"Loot\" là gì?", a: "Nhặt vũ khí, trang bị trên bản đồ", w: ["Bắn tỉa", "Lái xe", "Nhảy dù"], e: "Đầu trận ai loot nhanh hơn thường có lợi thế giao tranh." },
      { q: "\"Third party\" (bên thứ ba) là tình huống gì?", a: "Một đội tấn công hai đội đang đánh nhau", w: ["Mời thêm bạn vào đội", "Đổi bản đồ", "Hòa trận"], e: "Chờ hai đội đánh nhau rồi \"ngư ông đắc lợi\" là chiến thuật kinh điển." }
    ],
    skillGroups: [
      { id: "thao-tac", label: "Thao tác tay", questions: [
        { q: "Trên PUBG Mobile, chơi \"4 ngón\" khác 2 ngón ở điểm nào?", a: "Vừa di chuyển, vừa xoay góc nhìn, vừa bắn và ngắm cùng lúc", w: ["Chỉ để bấm nhanh hơn nút nhặt đồ", "Không có khác biệt", "Chỉ dùng được trên máy tính bảng"], e: "Hai ngón trỏ đặt trên nút bắn, ngồi, nhảy giúp bạn không phải rời ngón cái khỏi cần di chuyển và góc nhìn." },
        { q: "Con quay hồi chuyển (gyroscope) trên điện thoại giúp gì?", a: "Nghiêng điện thoại để ngắm và ghì tâm chính xác hơn", w: ["Tăng sát thương súng", "Tự động bắn", "Tăng tốc độ chạy"], e: "Nhiều người chơi PUBG Mobile giỏi bật gyro để kéo tâm bằng cổ tay thay vì ngón cái." },
        { q: "Vì sao nhiều người đặt thêm nút bắn bên trái màn hình?", a: "Để tay trái bắn trong khi tay phải vẫn xoay góc nhìn, ghì tâm", w: ["Để bắn hai súng cùng lúc", "Vì nút bên phải bị lỗi", "Để nhặt đồ nhanh"], e: "Bố cục nút tùy chỉnh là bước đầu tiên khi muốn chơi nghiêm túc." },
        { q: "Độ nhạy (sensitivity) nên chỉnh thế nào?", a: "Vừa đủ để xoay nhanh mà vẫn ghì tâm ổn định, rồi luyện cho quen", w: ["Luôn để cao nhất", "Luôn để thấp nhất", "Thay đổi mỗi trận"], e: "Không có con số đúng cho mọi người; quan trọng là giữ cố định để tay quen." },
        { q: "Trên bản PC, phím Q và E dùng để làm gì?", a: "Nghiêng người sang trái và phải", w: ["Nhảy và ngồi", "Đổi súng", "Mở bản đồ"], e: "Nghiêng người giúp bắn từ sau vật cản mà chỉ lộ một phần cơ thể." },
        { q: "Trên bản PC, giữ phím Alt để làm gì?", a: "Nhìn xung quanh tự do mà không đổi hướng chạy", w: ["Bắn nhanh hơn", "Hồi máu", "Ném lựu đạn"], e: "Vừa chạy vừa quan sát phía sau là kỹ năng rất có ích khi chạy bo." },
        { q: "Trên bản PC, phím B dùng để làm gì?", a: "Đổi chế độ bắn: phát một, loạt hoặc liên thanh", w: ["Mở ba lô", "Mở dù", "Lên xe"], e: "Bắn phát một ở tầm xa giúp đạn chụm hơn so với xả liên tục." },
        { q: "Trước khi vào trận, bạn nên luyện thao tác ở đâu?", a: "Bãi tập (Training) để thử súng, phụ kiện và độ giật", w: ["Vào trận xếp hạng luôn", "Chỉ xem video", "Không cần luyện"], e: "Vài phút khởi động ở bãi tập giúp tay vào nhịp trước khi đấu súng thật." }
      ]},
      { id: "di-chuyen", label: "Di chuyển & ẩn nấp", questions: [
        { q: "Bị bắn tỉa giữa bãi trống, bạn nên làm gì?", a: "Chạy zigzag và tìm vật cản gần nhất", w: ["Đứng yên băng bó", "Chạy thẳng một đường", "Nằm xuống giữa bãi"], e: "Di chuyển khó đoán khiến tay bắn tỉa khó ngắm trúng." },
        { q: "Đi bộ chậm (thay vì chạy) có lợi gì?", a: "Tiếng bước chân nhỏ hơn, khó bị phát hiện", w: ["Tăng máu", "Bắn chính xác hơn khi chạy", "Không có lợi gì"], e: "Khi tiếp cận nhà có địch, đi chậm giúp bạn không lộ vị trí." },
        { q: "Ngồi hoặc nằm khi bắn giúp gì?", a: "Giảm độ giật và thu nhỏ hình dáng, khó bị bắn trúng", w: ["Tăng tốc chạy", "Hồi máu nhanh", "Tăng sát thương"], e: "Nằm bắn ở tầm xa rất chính xác, nhưng di chuyển chậm khi bị phát hiện." },
        { q: "Trèo, vượt qua tường thấp và cửa sổ giúp gì khi di chuyển?", a: "Đổi hướng nhanh, thoát khỏi tầm bắn và tạo góc bất ngờ", w: ["Hồi máu", "Mở thùng thính", "Không có tác dụng"], e: "Dùng địa hình linh hoạt khiến đối thủ khó đoán vị trí của bạn." },
        { q: "Khi lái xe gặp phục kích, nên làm gì?", a: "Dừng xe làm vật chắn rồi nhảy xuống phía bên kia", w: ["Ngồi trên xe bắn trả", "Tắt máy ngồi yên", "Lái thẳng vào địch"], e: "Xe là chỗ nấp tạm thời, nhưng xe bốc cháy sẽ nổ nên đừng nấp quá lâu." },
        { q: "Vì sao không nên đứng mãi trên đỉnh đồi trơ trọi?", a: "Bị nhìn thấy từ mọi hướng, dễ bị bắn", w: ["Vì bị mất máu", "Vì không thấy gì", "Vì bo luôn tránh đồi"], e: "Đỉnh đồi có tầm nhìn tốt nhưng cần đá, cây hoặc dốc để che chắn." },
        { q: "Di chuyển trong nhà có địch, góc nào nguy hiểm nhất?", a: "Cầu thang và cửa ra vào", w: ["Giữa phòng trống không có ai", "Mái nhà xa", "Bãi đỗ xe"], e: "Đối thủ thường canh sẵn cầu thang và cửa; ném lựu đạn hoặc choáng trước khi vào." },
        { q: "Khi chạy giữa hai chỗ nấp, điều nên làm là gì?", a: "Chọn quãng chạy ngắn nhất và quan sát trước khi chạy", w: ["Chạy chỗ trống dài nhất", "Vừa chạy vừa hồi máu", "Nhảy liên tục giữa bãi trống"], e: "Mỗi giây ở chỗ trống là một giây đối thủ có thể bắn bạn." }
      ]},
      { id: "nhay-du", label: "Nhảy dù & điểm đáp", questions: [
        { q: "Người mới nên chọn điểm nhảy như thế nào?", a: "Nơi ít người, hơi xa đường bay để nhặt đồ an toàn", w: ["Luôn nhảy Pochinki", "Nhảy ngay khi máy bay cất cánh vào giữa đám đông", "Nhảy xuống biển"], e: "Có đồ đầy đủ rồi mới giao tranh giúp người mới sống lâu và học được nhiều hơn." },
        { q: "Muốn đáp đất nhanh nhất khi nhảy dù, bạn nên làm gì?", a: "Chúc đầu lao thẳng xuống trước khi mở dù", w: ["Mở dù ngay khi nhảy", "Bay ngang thật xa", "Đợi đến cuối đường bay"], e: "Đáp nhanh hơn đối thủ vài giây là có súng trước, rất quan trọng ở điểm đông người." },
        { q: "Muốn bay đến điểm xa đường bay, bạn nên làm gì?", a: "Nhảy sớm hơn và giữ tư thế lướt, mở dù sớm để bay xa", w: ["Chúc thẳng xuống", "Nhảy ở cuối đường bay", "Không mở dù"], e: "Lướt ngang và mở dù sớm cho quãng bay xa hơn rất nhiều." },
        { q: "Khi đang bay xuống, nên quan sát điều gì?", a: "Số người đáp xung quanh để tránh hoặc chuẩn bị giao tranh", w: ["Màu dù của đồng đội", "Bầu trời", "Không cần quan sát"], e: "Biết có bao nhiêu đội đáp gần giúp bạn quyết định nhặt đồ nhanh hay chuyển điểm." },
        { q: "Trong chế độ đội, vì sao nên đáp gần nhau?", a: "Để hỗ trợ và cứu nhau khi giao tranh đầu trận", w: ["Để chia đồ ít hơn", "Không cần thiết", "Để bị địch bắn cùng lúc"], e: "Đội đáp rời rạc rất dễ bị hạ lẻ từng người." },
        { q: "Vừa đáp đất, nên ưu tiên nhặt gì trước?", a: "Súng, giáp và mũ", w: ["Phụ kiện ống ngắm", "Trang phục", "Bình xăng"], e: "Có súng và đồ bảo hộ mới sống sót được giao tranh đầu tiên; phụ kiện có thể tìm sau." },
        { q: "Đáp xuống mái nhà có lợi gì?", a: "Vào nhà nhanh và có vị trí cao để quan sát", w: ["Có thùng thính trên mái", "Không bị bo đuổi", "Mái nhà hồi máu"], e: "Mái nhà và ban công cho phép đáp nhanh rồi vào trong nhặt đồ ngay." },
        { q: "Đáp xuống mà chỉ thấy địch đã có súng, bạn không có, nên làm gì?", a: "Tránh đối đầu, chạy sang nhà khác tìm súng", w: ["Lao vào đấm tay không", "Đứng yên chờ", "Nhảy lại lên máy bay"], e: "Sống sót để có súng quan trọng hơn liều mạng đầu trận." }
      ]},
      { id: "ban-sung", label: "Bắn súng & ngắm", questions: [
        { q: "Cách kiểm soát độ giật khi xả đạn liên tục là gì?", a: "Kéo tâm ngắm ngược xuống, gắn tay cầm và bù giật", w: ["Nhảy liên tục khi bắn", "Bắn mà không ngắm", "Bỏ hết phụ kiện"], e: "Tập kéo tâm ở bãi tập là cách nhanh nhất để bắn trúng ở tầm trung." },
        { q: "Bắn tỉa một mục tiêu đang chạy ở xa, bạn cần làm gì?", a: "Ngắm đón trước hướng di chuyển và tính độ rơi của đạn", w: ["Ngắm thẳng vào người", "Ngắm phía sau mục tiêu", "Bắn lên trời"], e: "Trong PUBG đạn có thời gian bay và rơi theo khoảng cách, không trúng ngay lập tức." },
        { q: "Ống ngắm nào hợp với cận chiến trong nhà?", a: "Red dot hoặc Holo", w: ["Ống 8x", "Ống 15x", "Không dùng ngắm"], e: "Ống phóng đại cao làm tầm nhìn hẹp, khó theo mục tiêu ở gần." },
        { q: "Ở tầm xa, bắn từng phát (tap) thay vì xả liên tục giúp gì?", a: "Đạn chụm hơn vì độ giật không kịp cộng dồn", w: ["Tăng sát thương mỗi viên", "Tiết kiệm thời gian nạp đạn", "Không có tác dụng"], e: "Xả liên thanh ở tầm xa phần lớn đạn sẽ bay lệch." },
        { q: "Vì sao nên ngắm vào tầm đầu?", a: "Headshot gây sát thương lớn nhất, hạ địch nhanh hơn", w: ["Vì chân không nhận sát thương", "Vì mũ không có tác dụng", "Không cần ngắm đầu"], e: "Để tâm ngắm sẵn ngang tầm đầu khi di chuyển giúp phản ứng nhanh hơn." },
        { q: "Súng dùng đạn 7.62mm thường khác đạn 5.56mm thế nào?", a: "Sát thương cao hơn nhưng giật mạnh hơn, khó kiểm soát", w: ["Sát thương thấp hơn và không giật", "Giống hệt nhau", "Chỉ dùng cho súng ngắn"], e: "AKM mạnh nhưng giật; M416 nhẹ đô nhưng dễ kiểm soát hơn." },
        { q: "Khi đối đầu cự ly gần, nên ngắm bắn kiểu nào?", a: "Bắn không mở ống (hip fire) hoặc ngắm nhanh, kết hợp nghiêng và di chuyển", w: ["Mở ống 8x", "Đứng yên ngắm thật lâu", "Ném băng gạc"], e: "Ở rất gần, tốc độ phản ứng quan trọng hơn độ chính xác tuyệt đối." },
        { q: "Hết đạn giữa giao tranh, nên làm gì?", a: "Đổi sang súng phụ thay vì nạp đạn khi địch đang bắn", w: ["Đứng yên nạp đạn", "Chạy thẳng vào địch", "Nhặt đồ"], e: "Đổi súng nhanh hơn nạp đạn; nạp đạn chỉ khi đã có chỗ nấp an toàn." }
      ]},
      { id: "vi-tri", label: "Chạy bo & vị trí", questions: [
        { q: "Chạy bo thế nào cho an toàn?", a: "Di chuyển sớm, chiếm vị trí tốt trong vùng an toàn trước người khác", w: ["Đợi bo sát lưng mới chạy", "Ở ngoài bo hồi máu", "Đi đường đông người cho nhanh"], e: "Vào bo muộn nghĩa là phải băng qua những đội đã chiếm sẵn chỗ nấp." },
        { q: "Đi dọc mép bo có lợi gì?", a: "Chỉ phải lo địch ở một phía, phía sau là vùng ngoài bo", w: ["Bo hồi máu", "Không ai thấy bạn", "Có nhiều đồ hơn"], e: "Mép bo hạn chế hướng bị tấn công, nhưng cần theo dõi bo thu hẹp." },
        { q: "Vì sao vị trí trên cao (high ground) có lợi?", a: "Nhìn được nhiều hơn và địch khó bắn trúng bạn", w: ["Bo không thu vào chỗ cao", "Tăng sát thương súng", "Không có lợi"], e: "Đứng cao giúp phát hiện địch sớm, nhưng cần vật che chắn." },
        { q: "Ở những vòng bo cuối, cách ẩn nấp phổ biến là gì?", a: "Nằm sát mặt đất, sau đá hoặc dốc, hạn chế bắn lộ vị trí", w: ["Chạy liên tục giữa bãi trống", "Đứng trên nóc xe", "Bắn mọi thứ nhìn thấy"], e: "Ở bo cuối, đội nào lộ vị trí trước thường bị loại trước." },
        { q: "Khi hai đội đang đấu súng gần bạn, bạn nên làm gì?", a: "Quan sát, chờ thời điểm rồi tấn công đội còn lại", w: ["Lao vào giữa hai đội", "Đứng giữa bãi để cổ vũ", "Bỏ chạy ra ngoài bo"], e: "Làm bên thứ ba đúng lúc giúp hạ được đội đã bị mất máu." },
        { q: "Nên bắt đầu chạy bo khi nào nếu ở xa vùng an toàn?", a: "Sớm, trước khi bo bắt đầu thu hẹp", w: ["Khi bo chạm lưng", "Không cần chạy", "Khi còn 10 người"], e: "Ở xa bo mà chạy muộn sẽ vừa mất máu vừa phải băng qua chỗ trống." },
        { q: "Nếu bị kẹt ngoài bo, ưu tiên điều gì?", a: "Dùng đồ tăng lực, hồi máu và chạy thẳng vào vùng an toàn", w: ["Ngồi lại nhặt đồ", "Đánh nhau với người khác ngoài bo", "Đứng yên chờ bo tới"], e: "Đồ tăng lực vừa hồi máu dần vừa giúp chạy nhanh hơn." },
        { q: "Nhà trong bo cuối (\"nhà bo\") có ưu và nhược điểm gì?", a: "Chỗ nấp tốt, nhưng bị nhiều đội vây quanh khi bo thu", w: ["Không có nhược điểm", "Không có ưu điểm", "Nhà bo luôn có thùng thính"], e: "Giữ nhà bo cần đủ đạn, lựu đạn và khói để thoát khi cần." }

      { q: "Khi thấy thùng thính rơi gần, game thủ thường phân vân điều gì?", a: "Lấy đồ xịn hay sợ bị phục kích", w: ["Có nên gỡ game", "Có nên đổi bản đồ", "Có nên tắt âm thanh"], e: "Thính là phần thưởng lớn nhưng cũng là cái bẫy kinh điển." },
      { q: "Vì sao PUBG Mobile phổ biến với giới trẻ Việt Nam?", a: "Chơi được trên điện thoại, dễ rủ bạn bè cùng đội", w: ["Chỉ chơi trên máy tính đắt tiền", "Bắt buộc trả phí", "Không có tiếng Việt"], e: "PUBG Mobile do VNG phát hành tại Việt Nam, có giao diện và sự kiện riêng cho người chơi Việt." }
    ]
  }
];
const COMING = ["Bạn muốn game nào tiếp theo?"];
const KEYS = ["A", "B", "C", "D"];
const MODES = {
  facts: { suffix: "", label: "Kiến thức game", list: (f) => f.questions, src: (f) => f.sources },
  eps: { suffix: "--tung-tap", label: "Chi tiết trong game", list: (f) => f.episodes || [], src: (f) => f.epSources || [] },
  terms: { suffix: "--y-nghia", label: "Thuật ngữ game thủ", list: (f) => f.terms || [], src: (f) => f.termSources || [] },
  skills: { suffix: "--ky-nang", label: "Kỹ năng chơi · tất cả", list: (f) => (f.skillGroups || []).flatMap((g) => g.questions.map((q) => ({ ...q, cat: g.label }))), src: (f) => f.skillSources || [] },
  emo: { suffix: "--cam-xuc", label: "Cảm xúc game thủ", list: (f) => f.emotions || [], src: (f) => f.emoSources || [] },
  all: {
    suffix: "--tong-hop", label: "Ôn tập tổng hợp",
    list: (f) => {
      const parts = ["facts", "eps", "terms", "skills", "emo"].filter((m) => MODES[m].list(f).length);
      return parts.length > 1 ? parts.flatMap((m) => MODES[m].list(f).map((q) => ({ ...q, cat: m === "skills" ? "Kỹ năng · " + q.cat : labelOf(f, m) }))) : [];
    },
    src: (f) => [...f.sources, ...(f.epSources || []), ...(f.termSources || []), ...(f.skillSources || []), ...(f.emoSources || [])].filter((s, i, a) => a.findIndex((x) => x[1] === s[1]) === i)
  }
};
// Mỗi nhóm kỹ năng (skillGroups) thành một bộ quiz riêng: #<game>--ky-nang-<nhóm>
FILMS.forEach((f) => (f.skillGroups || []).forEach((g) => {
  const m = "sk-" + g.id;
  if (MODES[m]) return;
  MODES[m] = { suffix: "--ky-nang-" + g.id, group: g.id, label: g.label,
    list: (film) => ((film.skillGroups || []).find((x) => x.id === g.id) || { questions: [] }).questions,
    src: (film) => film.skillSources || [] };
}));
const isSkill = (m) => m === "skills" || !!MODES[m].group;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const best = {
  get(id) { try { return Number(localStorage.getItem("best:" + id)) || 0; } catch { return 0; } },
  set(id, v) { try { if (v > this.get(id)) localStorage.setItem("best:" + id, v); } catch {} }
};
const labelOf = (f, m) => (m === "eps" && f.epLabel) || (MODES[m].group && ((f.skillGroups || []).find((g) => g.id === MODES[m].group) || {}).label) || MODES[m].label;
const clsOf = (m) => (MODES[m].group ? "skills sub" : m);
const keyOf = (film, mode) => film.id + MODES[mode].suffix;
function parseKey(key) {
  for (const mode of Object.keys(MODES).sort((a, b) => MODES[b].suffix.length - MODES[a].suffix.length)) {
    const sfx = MODES[mode].suffix;
    if (sfx && !key.endsWith(sfx)) continue;
    const film = FILMS.find((f) => f.id === key.slice(0, key.length - sfx.length));
    if (film && MODES[mode].list(film).length) return { film, mode };
  }
  return null;
}

let state = null;

function renderShelf() {
  const films = FILMS.map((f) => {
    const btn = (m) => {
      const n = MODES[m].list(f).length, b = best.get(keyOf(f, m));
      return `<button class="mode ${clsOf(m)}" data-key="${keyOf(f, m)}">
        <span class="mode-name">${labelOf(f, m)}</span>
        <span class="mode-meta">${n} câu${b ? ` · kỷ lục ${b}/${n}` : ""}</span>
      </button>`;
    };
    const groups = Object.keys(MODES).filter((m) => MODES[m].group && MODES[m].list(f).length);
    const modes = Object.keys(MODES).filter((m) => !MODES[m].group && MODES[m].list(f).length).map((m) =>
      m === "skills" && groups.length
        ? `<span class="skillbox"><span class="label">Kỹ năng chơi · ${groups.length} nhóm</span>${groups.map(btn).join("")}${btn(m)}</span>`
        : btn(m)).join("");
    return `<article class="film" data-film="${f.id}">
      <span class="poster" aria-hidden="true">${esc(f.motif)}</span>
      <span class="body">
        <span class="label">${esc(f.original)}</span>
        <h3>${esc(f.title)}</h3>
        <span class="meta">${esc(f.meta)}</span>
        <span class="modes">${modes}</span>
      </span>
    </article>`;
  }).join("");
  const soon = COMING.map((t) => `<div class="film soon" aria-disabled="true"><span class="poster" aria-hidden="true">+</span><span class="body"><span class="label">Sắp có</span><h3>${esc(t)}</h3><span class="meta">Câu đố mới sẽ được thêm vào thư viện.</span></span></div>`).join("");
  $("#shelf").innerHTML = films + soon;
  $("#shelf").querySelectorAll(".mode[data-key]").forEach((el) => el.addEventListener("click", () => { location.hash = el.dataset.key; }));
}

function start(key) {
  const p = parseKey(key);
  if (!p) return showLibrary();
  const { film, mode } = p;
  const list = MODES[mode].list(film);
  const qs = ((mode === "facts" && film.ordered) ? list : shuffle(list)).map((x) => ({ ...x, opts: shuffle([x.a, ...x.w]) }));
  state = { film, mode, key, qs, i: 0, picks: [] };
  document.body.dataset.film = film.id;
  $("#library").hidden = true;
  $("#game").hidden = false;
  renderFoot();
  renderQ();
  window.scrollTo(0, 0);
}

function showLibrary() {
  state = null;
  document.body.dataset.film = "home";
  $("#game").hidden = true;
  $("#library").hidden = false;
  renderShelf();
  renderFoot();
}

function track() {
  return `<div class="track" aria-hidden="true">${state.qs.map((q, k) => {
    const p = state.picks[k];
    const cls = p === undefined ? (k === state.i ? "now" : "") : (p === q.a ? "ok" : "no");
    return `<span class="${cls}"></span>`;
  }).join("")}</div>`;
}

function header() {
  const { film, mode } = state;
  const switcher = Object.keys(MODES).filter((m) => m !== mode && MODES[m].list(film).length && (!MODES[m].group || isSkill(mode)))
    .map((m) => `<button class="switch" data-key="${keyOf(film, m)}">${labelOf(film, m)} →</button>`).join("");
  return `
    <div class="topbar">
      <button class="back" id="back">← Thư viện game</button>
      <span class="label">${esc(film.original)}</span>
    </div>
    <div class="hero">
      <span class="motif" aria-hidden="true">${esc(film.motif)}</span>
      <h1>${esc(film.title)}</h1>
      <div class="hero-row"><span class="tag ${clsOf(mode)}">${labelOf(film, mode)}</span>${switcher}</div>
    </div>
    ${track()}`;
}

function bindHeader() {
  $("#back").addEventListener("click", () => { location.hash = ""; });
  $("#game").querySelectorAll(".switch").forEach((b) => b.addEventListener("click", () => { location.hash = b.dataset.key; }));
}

function correct() { return state.picks.filter((p, k) => p === state.qs[k].a).length; }

function renderQ() {
  const { qs, i } = state;
  const q = qs[i];
  const picked = state.picks[i];
  const done = picked !== undefined;
  const ok = picked === q.a;
  $("#game").innerHTML = `${header()}
    <article class="card">
      <div class="qhead"><span class="num">Câu ${String(i + 1).padStart(2, "0")} / ${qs.length}${q.cat ? ` · <span class="cat">${esc(q.cat)}</span>` : ""}</span><span class="score">Đúng ${correct()}</span></div>
      <h2 class="q">${esc(q.q)}</h2>
      <div class="opts">${q.opts.map((o, k) => {
        let cls = "";
        if (done && o === q.a) cls = "right";
        else if (done && o === picked) cls = "wrong";
        return `<button class="opt ${cls}" data-o="${esc(o)}" ${done ? "disabled" : ""}><span class="key">${KEYS[k]}</span><span>${esc(o)}</span></button>`;
      }).join("")}</div>
      ${done ? `<div class="explain ${ok ? "ok" : "no"}"><strong>${ok ? "Chính xác!" : "Chưa đúng. Đáp án: " + esc(q.a)}</strong><p>${esc(q.e)}</p></div>
      <div class="actions"><button class="btn" id="next">${i + 1 < qs.length ? "Câu tiếp theo →" : "Xem kết quả"}</button></div>` : ""}
    </article>`;
  bindHeader();
  $("#game").querySelectorAll(".opt:not(:disabled)").forEach((b) => b.addEventListener("click", () => pick(b.dataset.o)));
  const nx = $("#next");
  if (nx) { nx.addEventListener("click", next); nx.focus({ preventScroll: true }); }
}

function pick(o) {
  if (state.picks[state.i] !== undefined) return;
  state.picks[state.i] = o;
  renderQ();
}

function next() {
  if (state.i + 1 < state.qs.length) { state.i++; renderQ(); }
  else renderResult();
}

function verdict(r, mode) {
  if (mode === "all") {
    if (r === 1) return "Hoàn hảo. Bạn nắm trọn tựa game này từ mọi góc nhìn.";
    if (r >= .75) return "Rất vững. Chỉ còn vài chỗ cần ôn lại.";
    if (r >= .5) return "Nắm được phần chính. Xem lại các câu sai bên dưới để ôn.";
    return "Hãy làm lại từng bộ quiz nhỏ trước rồi quay lại ôn tổng hợp.";
  }
  if (mode === "terms") {
    if (r === 1) return "Bạn nói chuyện như game thủ lâu năm.";
    if (r >= .75) return "Rất thạo ngôn ngữ của cộng đồng game.";
    if (r >= .5) return "Khá ổn. Vào kênh chat cộng đồng thêm vài hôm là thạo.";
    return "Còn nhiều tiếng lóng đang chờ bạn học.";
  }
  if (isSkill(mode)) {
    if (r === 1) return "Kỹ năng hoàn hảo. Bạn chơi như tuyển thủ chuyên nghiệp.";
    if (r >= .75) return "Rất chắc tay. Đồng đội nào cũng muốn ghép cặp với bạn.";
    if (r >= .5) return "Có nền tảng tốt. Áp dụng vài mẹo bên dưới là lên trình ngay.";
    return "Đọc kỹ phần giải thích rồi vào game luyện thêm nhé.";
  }
  if (mode === "emo") {
    if (r === 1) return "Bạn hiểu game thủ đến từng nhịp tim.";
    if (r >= .75) return "Bạn rất hiểu cộng đồng người chơi.";
    if (r >= .5) return "Khá hiểu ý game thủ, thử lướt thêm vài group cộng đồng.";
    return "Có vẻ bạn chơi một mình, chưa vào group nào.";
  }
  if (r === 1) return "Game thủ chính hiệu. Bạn nắm game đến từng chi tiết.";
  if (r >= .75) return "Rất ấn tượng. Bạn đã chơi game này kỹ.";
  if (r >= .5) return "Khá ổn. Chơi thêm vài mùa là thành cao thủ.";
  return "Có lẽ đến lúc vào game cày thêm rồi.";
}

function renderResult() {
  const { qs, key, mode } = state;
  const c = correct();
  best.set(key, c);
  $("#game").innerHTML = `${header()}
    <article class="card result">
      <span class="label">Kết quả · ${labelOf(state.film, mode)}</span>
      <div class="big">${c}<small> / ${qs.length}</small></div>
      <p class="verdict">${verdict(c / qs.length, mode)}</p>
      <ul class="review">${qs.map((q, k) => {
        const ok = state.picks[k] === q.a;
        return `<li><span class="mark ${ok ? "ok" : "no"}">${ok ? "✓" : "✗"}</span><span>${esc(q.q)}<br><span class="ans">${ok ? esc(q.a) : `Bạn chọn ${esc(state.picks[k])} · Đáp án ${esc(q.a)}`}</span></span></li>`;
      }).join("")}</ul>
      <div class="actions">
        <button class="btn ghost" id="lib">Chọn game khác</button>
        <button class="btn" id="again">Chơi lại</button>
      </div>
    </article>`;
  bindHeader();
  $("#lib").addEventListener("click", () => { location.hash = ""; });
  $("#again").addEventListener("click", () => start(key));
  window.scrollTo(0, 0);
}

function renderFoot() {
  const src = state ? MODES[state.mode].src(state.film) : [];
  $("#foot").innerHTML = state
    ? `Nguồn dữ kiện: ${src.map(([n, u]) => `<a href="${u}" target="_blank" rel="noopener">${n}</a>`).join(", ")}.`
    : `Mỗi game có các bộ câu hỏi kiến thức game, chi tiết trong game, thuật ngữ game thủ, cảm xúc game thủ, cùng phần kỹ năng chơi chia thành nhiều nhóm nhỏ (thao tác tay, di chuyển…) và một mục ôn tập tổng hợp gộp tất cả. Kỷ lục chỉ lưu trên trình duyệt của bạn.`;
}

function route() {
  const key = location.hash.slice(1);
  if (key && parseKey(key)) { if (!state || state.key !== key) start(key); }
  else showLibrary();
}

document.addEventListener("keydown", (e) => {
  if (!state || $("#game").hidden) return;
  const k = KEYS.indexOf(e.key.toUpperCase());
  const btns = $("#game").querySelectorAll(".opt:not(:disabled)");
  if (k >= 0 && btns[k]) btns[k].click();
});
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
