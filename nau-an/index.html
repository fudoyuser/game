* { box-sizing: border-box; }
html { background: var(--bg); }
body {

.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 32px; }

}
.topic:hover { transform: translateY(-3px); box-shadow: 0 14px 40px -18px var(--accent); }
.topic .poster {
  height: 104px; display: grid; place-items: center; border-bottom: 1px solid var(--line); font-size: 46px;
  background: radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%), var(--opt);

.topic .body { padding: 18px 20px 20px; display: grid; gap: 8px; align-content: start; }
.topic h3 { font-size: 23px; }
.topic .meta { font-size: 14px; color: var(--muted); }
.topic .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

.game { display: grid; gap: 20px; }
.hero { display: grid; gap: 6px; }
.hero .motif { font-size: 32px; }
.hero h1 { font-size: clamp(32px, 7vw, 48px); }
.hero p { margin: 0; color: var(--muted); }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.back { background: none; border: 0; padding: 0; color: var(--muted); font-size: 14px; }
.back:hover { color: var(--accent); }
.track { display: grid; grid-auto-flow: column; gap: 3px; }
.track span { height: 6px; border-radius: 3px; background: var(--line); }
.track span.ok { background: var(--ok); }
.track span.no { background: var(--no); }
.track span.now { background: var(--accent); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: clamp(20px, 5vw, 36px); display: grid; gap: 20px; box-shadow: 0 20px 50px -30px color-mix(in srgb, var(--accent) 60%, transparent); }

.num, .score { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; font-variant-numeric: tabular-nums; }
.num { color: var(--accent); }
.score { color: var(--muted); }
.cat { color: var(--muted); }
.q { font-size: clamp(21px, 4.5vw, 27px); }
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: center; text-align: left;
  background: var(--opt); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; color: var(--ink);
  transition: border-color .12s, background .12s, transform .12s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); transform: translateX(2px); }
.opt .key { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; border: 1px solid var(--line); color: var(--muted); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .key { background: var(--ok); border-color: var(--ok); color: var(--card); }
.opt.wrong { border-color: var(--no); background: var(--no-soft); }
.opt.wrong .key { background: var(--no); border-color: var(--no); color: var(--card); }
.explain { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 4px; }
.explain strong { font-family: "Fraunces", Georgia, serif; font-size: 19px; }
.explain.ok strong { color: var(--ok); }
.explain.no strong { color: var(--no); }
.explain p { margin: 0; color: var(--muted); }
.actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 99px; padding: 11px 22px; background: var(--accent); color: var(--accent-ink); font-weight: 600; transition: filter .15s; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.ghost:hover { border-color: var(--accent); }

.big { font-family: "Fraunces", Georgia, serif; font-size: clamp(64px, 16vw, 104px); line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }
.big small { font-size: .4em; color: var(--muted); font-weight: 500; }
.verdict { font-family: "Fraunces", Georgia, serif; font-style: italic; font-size: 22px; margin: 0; }
.review { display: grid; margin: 0; padding: 0; list-style: none; }
.review li { display: grid; grid-template-columns: 20px 1fr; gap: 10px; font-size: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.review li:last-child { border-bottom: 0; }
.review .mark { font-family: "JetBrains Mono", ui-monospace, monospace; }
.review .mark.ok { color: var(--ok); }
.review .mark.no { color: var(--no); }
.review .ans { color: var(--muted); }
.foot { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
.foot a { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

    <p>Lý thuyết nấu ăn, gia vị và chuyện rau củ nào hợp món nào. Mỗi lượt chơi bốc ngẫu nhiên câu hỏi, đáp án nào cũng có giải thích.</p>

<script>
const TOPICS = [
  {
    id: "ly-thuyet",
    icon: "🔥",
    title: "Lý thuyết nấu ăn",
    sub: "Nhiệt, kỹ thuật, an toàn thực phẩm",
    per: 15,
    questions: [
      { q: "Phản ứng Maillard tạo lớp vỏ nâu thơm cho thịt nướng, bánh mì diễn ra mạnh ở nhiệt độ khoảng bao nhiêu?", a: "Từ khoảng 140°C trở lên", w: ["Khoảng 60°C", "Khoảng 80°C", "Đúng 100°C"], e: "Maillard là phản ứng giữa protein (axit amin) và đường khử, mạnh lên rõ từ khoảng 140°C. Vì thế đồ luộc (tối đa 100°C) không bao giờ có lớp vỏ nâu như đồ áp chảo hay nướng." },
      { q: "Caramel hóa khác phản ứng Maillard ở điểm nào?", a: "Chỉ cần đường bị nhiệt phân, không cần protein", w: ["Chỉ xảy ra với protein", "Chỉ xảy ra khi có axit", "Chỉ xảy ra dưới 100°C"], e: "Caramel hóa là đường tự phân hủy dưới nhiệt cao, cho màu nâu và vị ngọt đắng. Thắng nước màu (nước hàng) để kho thịt, kho cá chính là caramel hóa." },
      { q: "Vì sao nên thấm khô thịt, cá trước khi áp chảo?", a: "Nước bề mặt hạ nhiệt chảo, làm thịt bị hấp thay vì xém vàng", w: ["Để thịt ngấm gia vị nhanh hơn", "Để dầu không bị đổi màu", "Để thịt chín nhanh hơn ở giữa"], e: "Nước phải bay hơi hết thì bề mặt mới vượt 100°C để Maillard xảy ra. Thịt ướt sẽ ra nước, tái xám và không có vỏ thơm." },
      { q: "Chần rau qua nước sôi rồi thả ngay vào nước đá nhằm mục đích gì?", a: "Dừng quá trình chín, giữ rau xanh và giòn", w: ["Làm rau mềm nhừ nhanh hơn", "Rửa sạch thuốc trừ sâu hoàn toàn", "Giúp rau ngấm muối"], e: "Nước đá \"sốc nhiệt\" chặn nhiệt dư tiếp tục làm chín rau, nhờ đó giữ màu xanh tươi và độ giòn. Kỹ thuật này hay dùng cho súp lơ, đậu que, cải trước khi xào hoặc trộn salad." },
      { q: "\"Vùng nguy hiểm\" nhiệt độ, nơi vi khuẩn trong thức ăn sinh sôi nhanh nhất, nằm trong khoảng nào?", a: "Khoảng 5°C đến 60°C", w: ["Dưới 0°C", "Khoảng 60°C đến 100°C", "Trên 100°C"], e: "Trong khoảng 5–60°C vi khuẩn có thể nhân đôi chỉ sau khoảng 20 phút. Đồ ăn chín không nên để ở nhiệt độ phòng quá 2 tiếng." },
      { q: "Thịt gà được coi là chín an toàn khi nhiệt độ ở phần dày nhất đạt bao nhiêu?", a: "74°C", w: ["50°C", "60°C", "100°C"], e: "Mốc 74°C (165°F) diệt được Salmonella và Campylobacter gần như tức thì. Đo ở chỗ dày nhất, không chạm xương." },
      { q: "Vì sao nên để thịt \"nghỉ\" vài phút sau khi nướng hoặc áp chảo rồi mới cắt?", a: "Để dịch thịt phân bố lại, cắt ra ít chảy nước và mọng hơn", w: ["Để thịt nguội cho dễ ăn", "Để gia vị kịp ngấm", "Để thịt chín thêm hoàn toàn từ sống"], e: "Khi nướng, dịch thịt dồn về giữa. Nghỉ 5–10 phút giúp thớ thịt thả lỏng và giữ lại nước, nên miếng thịt mọng hơn." },
      { q: "Vì sao bắp bò, nạm, đuôi bò hợp với hầm, om lâu hơn là xào nhanh?", a: "Collagen trong mô liên kết cần nấu lâu mới chuyển thành gelatin mềm", w: ["Vì chúng ít mỡ nên dễ cháy khi xào", "Vì chúng có vị đắng cần hầm để bay đi", "Vì chúng quá mềm, xào sẽ nát"], e: "Phần thịt vận động nhiều chứa nhiều collagen. Nấu lâu ở lửa liu riu, collagen tan thành gelatin, thịt mềm và nước dùng sánh." },
      { q: "Thái thịt bò để xào sao cho mềm?", a: "Thái ngang thớ, lát mỏng", w: ["Thái dọc theo thớ, lát dày", "Thái hạt lựu thật to", "Băm nhuyễn rồi nặn lại"], e: "Thái ngang thớ cắt ngắn các sợi cơ, khi nhai sợi thịt dễ đứt nên cảm giác mềm hơn hẳn." },
      { q: "Om (braise) là kỹ thuật nào?", a: "Áp chảo cho xém rồi nấu lửa nhỏ với ít chất lỏng, đậy nắp trong thời gian dài", w: ["Chiên ngập dầu ở lửa lớn", "Hấp cách thủy trong nồi kín", "Nướng trực tiếp trên than hồng"], e: "Om kết hợp nhiệt khô (áp chảo tạo hương) và nhiệt ướt (ninh chậm làm mềm). Bò sốt vang, cà bung, gà om nấm đều theo nguyên lý này." },
      { q: "Trong sốt mayonnaise, thành phần nào giúp dầu và nước hòa thành nhũ tương không bị tách?", a: "Lòng đỏ trứng (chứa lecithin)", w: ["Lòng trắng trứng", "Đường", "Muối"], e: "Lecithin trong lòng đỏ có một đầu ưa nước, một đầu ưa dầu, bao quanh các giọt dầu li ti để chúng không gộp lại và tách lớp." },
      { q: "Roux, nền làm sánh nhiều loại sốt Âu, gồm những gì?", a: "Bột mì xào với bơ", w: ["Bột năng hòa nước lạnh", "Lòng đỏ trứng đánh với sữa", "Kem tươi đun cạn"], e: "Roux là bột mì và chất béo (thường là bơ) xào cùng nhau. Xào càng lâu roux càng sẫm màu, thơm hơn nhưng làm sánh kém hơn." },
      { q: "Muốn làm sánh canh, súp bằng bột năng mà không bị vón cục, nên làm gì?", a: "Hòa bột với nước lạnh trước rồi đổ từ từ vào nồi đang sôi, khuấy đều", w: ["Rắc bột khô thẳng vào nồi đang sôi", "Đổ bột vào lúc nồi còn lạnh rồi để yên", "Hòa bột với nước sôi già trước"], e: "Tinh bột gặp nước nóng sẽ hồ hóa ngay ở lớp ngoài, bọc lớp bột khô bên trong thành cục. Hòa với nước lạnh trước giúp các hạt bột tách rời." },
      { q: "\"Mise en place\" trong bếp chuyên nghiệp nghĩa là gì?", a: "Sơ chế, cân đo và bày sẵn mọi nguyên liệu trước khi bắt đầu nấu", w: ["Bày món ăn ra đĩa cho đẹp", "Dọn dẹp bếp sau khi nấu", "Nếm lại món trước khi phục vụ"], e: "Mise en place là \"mọi thứ vào đúng chỗ\" trong tiếng Pháp. Đặc biệt quan trọng với món xào lửa lớn, nơi không có thời gian vừa nấu vừa thái." },
      { q: "Loại chất béo nào hợp nhất để chiên ngập dầu ở nhiệt độ cao?", a: "Dầu đậu phộng hoặc dầu hướng dương tinh luyện", w: ["Bơ động vật", "Dầu mè ép lạnh", "Dầu óc chó"], e: "Dầu tinh luyện có điểm bốc khói cao (trên 220°C) và vị trung tính. Bơ, dầu mè ép lạnh, dầu óc chó bốc khói sớm, dễ cháy khét và tạo vị đắng." },

      { q: "Khoai tây loại bở, nhiều tinh bột hợp nhất với món nào?", a: "Khoai tây nghiền, khoai tây chiên", w: ["Salad khoai giữ nguyên miếng", "Khoai hầm cần giữ hình dạng", "Khoai luộc thái lát mỏng trang trí"], e: "Khoai bở cho kết cấu xốp, bông. Loại khoai dẻo (ít tinh bột) giữ miếng tốt hơn, hợp với salad và món hầm." },
      { q: "Thịt kho hột vịt (thịt kho tàu) miền Nam thường dùng nước gì để kho?", a: "Nước dừa tươi", w: ["Nước luộc rau muống", "Nước vo gạo", "Nước me"], e: "Nước dừa cho vị ngọt thanh và màu cánh gián bóng đẹp, thịt mềm mà không cần nhiều đường." },
      { q: "Muốn nồi nước dùng xương ngọt thanh tự nhiên, người ta hay thả thêm củ gì?", a: "Củ cải trắng hoặc hành tây", w: ["Củ nghệ", "Củ riềng", "Củ dền đỏ"], e: "Củ cải trắng và hành tây tiết vị ngọt dịu, không lấn mùi. Củ dền sẽ nhuộm đỏ nước dùng, nghệ và riềng mùi quá mạnh." },
      { q: "Hoa chuối (bắp chuối) thái sợi để làm nộm, ăn kèm bún, cần ngâm vào gì để không thâm?", a: "Nước có pha chanh hoặc giấm", w: ["Nước đường", "Nước sôi", "Dầu ăn"], e: "Axit ức chế enzyme gây thâm. Hoa chuối cũng nên thái xong thả ngay vào nước, đeo găng để tránh nhựa dính tay." },
      { q: "Vì sao quả bơ (avocado) hiếm khi được nấu chín lâu?", a: "Đun nóng lâu làm bơ có vị đắng", w: ["Bơ chín sẽ có độc", "Bơ sẽ tan thành nước", "Bơ sẽ chuyển màu tím"], e: "Hợp chất trong bơ biến đổi khi gặp nhiệt lâu, tạo vị đắng. Bơ hợp nhất với sinh tố, salad, guacamole hoặc chỉ hâm nóng thật nhanh." },
      { q: "Táo, lê, chuối cắt ra để một lúc bị thâm nâu là do đâu?", a: "Enzyme polyphenol oxidase gặp oxy", w: ["Vi khuẩn làm hỏng ngay lập tức", "Đường trong quả bị cháy", "Quả bị nhiễm kim loại từ dao"], e: "Đây là phản ứng enzyme, không phải hỏng. Vắt chanh, ngâm nước muối loãng hoặc bọc kín sẽ làm chậm lại." },
      { q: "Bí đao thường được nấu canh cùng gì?", a: "Tôm khô hoặc sườn heo", w: ["Mắm tôm và riềng", "Nước cốt dừa và đường", "Thịt bò tái chanh"], e: "Bí đao ngọt mát, nhạt vị, nên cần tôm hoặc xương để nước canh ngọt. Đây là món giải nhiệt mùa hè." },
      { q: "Cải cúc (tần ô) có mùi thơm riêng, thường được nấu canh với gì?", a: "Thịt băm", w: ["Cua đồng và rau đay", "Mắm ruốc và sả", "Tiết canh"], e: "Canh cải cúc thịt băm có mùi thơm dịu, nên cho rau vào khi nước sôi và tắt bếp gần như ngay để rau không nhũn." },
      { q: "Rau thơm thường dùng nhiều nhất để ăn kèm bún chả Hà Nội là?", a: "Xà lách, tía tô, kinh giới, húng", w: ["Ngò gai và ngò om", "Rau răm và lá chanh", "Thì là và hành tây"], e: "Bộ rau sống bún chả mát và thơm, cân lại vị đậm, béo của chả nướng than." },
      { q: "Đậu bắp có chất nhớt đặc trưng. Món nào tận dụng tốt đặc điểm này?", a: "Canh chua và đậu bắp luộc chấm chao", w: ["Chè đậu bắp nấu đường", "Đậu bắp sấy giòn ăn vặt", "Rượu ngâm đậu bắp"], e: "Chất nhớt làm canh chua sánh nhẹ. Luộc nguyên trái, không cắt trước, sẽ giữ nhớt bên trong và quả giòn hơn." }
    ]
  }
];

const MIX = { id: "tong-hop", icon: "🍲", title: "Ôn tập tổng hợp", sub: "Trộn câu hỏi từ cả ba chủ đề", per: 20 };
const KEYS = ["A", "B", "C", "D"];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const best = {
  get(id) { try { return Number(localStorage.getItem("cook-best:" + id)) || 0; } catch { return 0; } },
  set(id, v) { try { if (v > this.get(id)) localStorage.setItem("cook-best:" + id, v); } catch {} }
};
const ALL = [...TOPICS, MIX];
const pool = (t) => t === MIX ? TOPICS.flatMap((x) => x.questions.map((q) => ({ ...q, cat: x.title }))) : t.questions;
const roundSize = (t) => Math.min(t.per, pool(t).length);

let state = null;

function renderShelf() {
  $("#shelf").innerHTML = ALL.map((t) => {
    const n = roundSize(t), total = pool(t).length, b = best.get(t.id);
    return `<button class="topic" data-topic="${t.id}" data-id="${t.id}">
      <span class="poster" aria-hidden="true">${t.icon}</span>
      <span class="body">
        <span class="label">${esc(t.sub)}</span>
        <h3>${esc(t.title)}</h3>
        <span class="meta">${n} câu mỗi lượt, bốc ngẫu nhiên từ ${total} câu</span>
        <span class="row"><span class="pill">Bắt đầu</span>${b ? `<span class="pill ok">Kỷ lục ${b}/${n}</span>` : ""}</span>
      </span>
    </button>`;
  }).join("");
  $("#shelf").querySelectorAll(".topic").forEach((el) => el.addEventListener("click", () => { location.hash = el.dataset.id; }));
}

function start(id) {
  const topic = ALL.find((t) => t.id === id);
  if (!topic) return showLibrary();
  const qs = shuffle(pool(topic)).slice(0, roundSize(topic)).map((x) => ({ ...x, opts: shuffle([x.a, ...x.w]) }));
  state = { topic, qs, i: 0, picks: [] };
  document.body.dataset.topic = topic.id;
  $("#library").hidden = true;
  $("#game").hidden = false;
  renderFoot();
  renderQ();
  window.scrollTo(0, 0);
}

function showLibrary() {
  state = null;
  document.body.dataset.topic = "home";
  $("#game").hidden = true;
  $("#library").hidden = false;
  renderShelf();
  renderFoot();
}

function header() {
  const { topic, qs } = state;
  return `
    <div class="topbar">
      <button class="back" id="back">← Chọn chủ đề</button>
      <span class="label">Đố Vui Gian Bếp</span>
    </div>
    <div class="hero">
      <span class="motif" aria-hidden="true">${topic.icon}</span>
      <h1>${esc(topic.title)}</h1>
      <p>${esc(topic.sub)}</p>
    </div>
    <div class="track" aria-hidden="true">${qs.map((q, k) => {
      const p = state.picks[k];
      return `<span class="${p === undefined ? (k === state.i ? "now" : "") : (p === q.a ? "ok" : "no")}"></span>`;
    }).join("")}</div>`;
}

const correct = () => state.picks.filter((p, k) => p === state.qs[k].a).length;

function renderQ() {
  const { qs, i } = state;
  const q = qs[i], picked = state.picks[i], done = picked !== undefined, ok = picked === q.a;
  $("#game").innerHTML = `${header()}
    <article class="card">
      <div class="qhead"><span class="num">Câu ${String(i + 1).padStart(2, "0")} / ${qs.length}${q.cat ? ` · <span class="cat">${esc(q.cat)}</span>` : ""}</span><span class="score">Đúng ${correct()}</span></div>
      <h2 class="q">${esc(q.q)}</h2>
      <div class="opts">${q.opts.map((o, k) => {
        const cls = done && o === q.a ? "right" : done && o === picked ? "wrong" : "";
        return `<button class="opt ${cls}" data-o="${esc(o)}" ${done ? "disabled" : ""}><span class="key">${KEYS[k]}</span><span>${esc(o)}</span></button>`;
      }).join("")}</div>
      ${done ? `<div class="explain ${ok ? "ok" : "no"}"><strong>${ok ? "Chính xác!" : "Chưa đúng. Đáp án: " + esc(q.a)}</strong><p>${esc(q.e)}</p></div>
      <div class="actions"><button class="btn" id="next">${i + 1 < qs.length ? "Câu tiếp theo →" : "Xem kết quả"}</button></div>` : ""}
    </article>`;
  $("#back").addEventListener("click", () => { location.hash = ""; });
  $("#game").querySelectorAll(".opt:not(:disabled)").forEach((b) => b.addEventListener("click", () => pick(b.dataset.o)));
  const nx = $("#next");
  if (nx) { nx.addEventListener("click", next); nx.focus({ preventScroll: true }); }
}

function pick(o) {
  if (state.picks[state.i] !== undefined) return;
  state.picks[state.i] = o;
  renderQ();
}

function next() {
  if (state.i + 1 < state.qs.length) { state.i++; renderQ(); }
  else renderResult();
}

function verdict(r) {
  if (r === 1) return "Đầu bếp thực thụ. Không câu nào làm khó được bạn.";
  if (r >= .75) return "Tay nghề vững vàng, chỉ còn vài mẹo nhỏ cần ghi nhớ.";
  if (r >= .5) return "Nắm được cơ bản. Đọc lại phần giải thích các câu sai nhé.";
  return "Bếp còn nhiều bí mật. Chơi lại để gặp câu hỏi mới!";
}

function renderResult() {
  const { qs, topic } = state;
  const c = correct();
  best.set(topic.id, c);
  $("#game").innerHTML = `${header()}
    <article class="card result">
      <span class="label">Kết quả</span>
      <div class="big">${c}<small> / ${qs.length}</small></div>
      <p class="verdict">${verdict(c / qs.length)}</p>
      <ul class="review">${qs.map((q, k) => {
        const ok = state.picks[k] === q.a;
        return `<li><span class="mark ${ok ? "ok" : "no"}">${ok ? "✓" : "✗"}</span><span>${esc(q.q)}<br><span class="ans">${ok ? esc(q.a) : `Bạn chọn ${esc(state.picks[k])} · Đáp án ${esc(q.a)}`}</span></span></li>`;
      }).join("")}</ul>
      <div class="actions">
        <button class="btn ghost" id="lib">Chọn chủ đề khác</button>
        <button class="btn" id="again">Chơi lượt mới</button>
      </div>
    </article>`;
  $("#back").addEventListener("click", () => { location.hash = ""; });
  $("#lib").addEventListener("click", () => { location.hash = ""; });
  $("#again").addEventListener("click", () => start(topic.id));
  window.scrollTo(0, 0);
}

function renderFoot() {
  $("#foot").innerHTML = state
    ? `Mẹo: bấm phím A, B, C, D để chọn nhanh đáp án.`
    : `${TOPICS.reduce((s, t) => s + t.questions.length, 0)} câu hỏi về kỹ thuật nấu, gia vị và cách phối rau củ. Mỗi lượt chơi bốc câu ngẫu nhiên và đảo thứ tự đáp án. Kỷ lục chỉ lưu trên trình duyệt của bạn.`;
}

function route() {
  const id = location.hash.slice(1);
  if (id && ALL.some((t) => t.id === id)) { if (!state || state.topic.id !== id) start(id); }
  else showLibrary();
}

document.addEventListener("keydown", (e) => {
  if (!state || $("#game").hidden) return;
  const k = KEYS.indexOf(e.key.toUpperCase());
  const btns = $("#game").querySelectorAll(".opt:not(:disabled)");
  if (k >= 0 && btns[k]) btns[k].click();
});
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
